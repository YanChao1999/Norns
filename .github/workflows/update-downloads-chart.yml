name: Update downloads chart

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate chart
        run: python scripts/generate_downloads_chart.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- assets/downloads-trend.svg; then
            echo "No chart changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/downloads-trend.svg
          git commit -m "Refresh PyPI downloads trend chart."
          git push
