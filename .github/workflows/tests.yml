name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: python -m pytest backend/tests/ -q

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build wheel and sdist
        run: |
          pip install build twine
          python -m build
          python -m twine check dist/*
          python scripts/check-dist.py
      - name: Install package
        run: pip install dist/*.whl
      - name: Check CLI and local server
        run: |
          norns --help
          norns --version
          python -c "import norns, pathlib; root = pathlib.Path(norns.__file__).with_name('web'); assert (root / 'index.html').is_file(), root"
          norns init --home "$RUNNER_TEMP/norns-home"
          norns run --home "$RUNNER_TEMP/norns-home" --no-window &
          server_pid=$!
          for _ in $(seq 1 50); do
            if curl -fsS "http://127.0.0.1:8765/api/health" && curl -fsS "http://127.0.0.1:8765/" | grep -q 'id="root"'; then
              kill "$server_pid"
              wait "$server_pid" || true
              exit 0
            fi
            sleep 0.2
          done
          kill "$server_pid" || true
          echo "Norns local server did not become healthy"
          exit 1

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Ruff
        run: pip install "ruff>=0.8.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Lint and format
        run: bash scripts/lint.sh

  ci:
    name: CI
    if: always()
    needs: [backend, frontend, lint, package]
    runs-on: ubuntu-latest
    steps:
      - name: Require backend, frontend, lint, and package
        run: |
          test "${{ needs.backend.result }}" = "success"
          test "${{ needs.frontend.result }}" = "success"
          test "${{ needs.lint.result }}" = "success"
          test "${{ needs.package.result }}" = "success"
