[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "norns"
version = "0.1.0"
description = "Kanban orchestration system with per-column LLM agents and human approval gates"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy[asyncio]>=2.0.32",
  "asyncpg>=0.29.0",
  "aiosqlite>=0.20.0",
  "arq>=0.26.0",
  "openai>=1.40.0",
  "PyGithub>=2.3.0",
  "jira>=3.8.0",
  "polarion>=1.0.0",
  "cryptography>=43.0.0",
  "itsdangerous>=2.2.0",
  "pydantic-settings>=2.4.0",
  "httpx>=0.27.0",
  "plantuml>=0.3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.23.8",
  "pytest-cov>=5.0.0",
]

[tool.setuptools.packages.find]
include = ["backend*", "worker*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
