[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "norns"
version = "0.0.1"
description = "Kanban orchestration system with per-column LLM agents and human approval gates"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy[asyncio]>=2.0.32",
  "asyncpg>=0.29.0",
  "aiosqlite>=0.20.0",
  "arq>=0.26.0",
  "openai>=1.40.0",
  "PyGithub>=2.3.0",
  "jira>=3.8.0",
  "polarion>=1.0.0",
  "cryptography>=43.0.0",
  "itsdangerous>=2.2.0",
  "pydantic-settings>=2.4.0",
  "httpx>=0.27.0",
  "plantuml>=0.3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.23.8",
  "pytest-cov>=5.0.0",
  "ruff>=0.8.0",
  "build>=1.2.0",
]

[project.scripts]
norns = "norns.cli:main"

[tool.setuptools.packages.find]
include = ["backend*", "worker*", "norns*"]

[tool.setuptools.package-data]
norns = ["web/**/*", "electron/main.js", "electron/package.json", "electron/package-lock.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["backend", "worker", "norns"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B",
  "UP",
  "SIM",
]
ignore = [
  "E501",
  "UP042",
]

[tool.ruff.lint.isort]
known-first-party = ["backend", "worker", "norns"]
