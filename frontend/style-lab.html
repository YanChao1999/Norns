<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Norns · Style lab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Inter:wght@400;500;600&family=Karla:wght@400;500;600&family=Source+Sans+3:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style-lab.css" />
  </head>
  <body>
    <div class="lab">
      <header class="lab-bar">
        <div>
          <p class="lab-kicker">Norns · style lab</p>
          <h1>Review the four languages, then select one</h1>
        </div>
        <p class="lab-note">
          Mock UI only. No API. Click a style to see it full-size, then press
          Select. Your pick is stored in this browser.
        </p>
      </header>
      <nav class="lab-tabs" id="tabs" aria-label="Style views"></nav>
      <div class="lab-picked" id="picked" role="status"></div>
      <div id="stage"></div>
    </div>
    <script src="./style-lab.js"></script>
  </body>
</html>
